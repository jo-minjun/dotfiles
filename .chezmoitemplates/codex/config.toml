model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = 'danger-full-access'
service_tier = "default"
notify = ["{{ .chezmoi.homeDir }}/.local/bin/lockpaw", "ping", "--agent", "codex"]

[agents]
max_concurrent_threads_per_session = 10

[mcp_servers]
[mcp_servers.MCP_DOCKER]
command = 'docker'
args = ['mcp', 'gateway', 'run']

[mcp_servers.MCP_DOCKER.tools.mcp-find]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.mcp-add]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_transition_issue]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_add_comment]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_edit_comment]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.notion-update-page]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_create_issue]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_update_issue]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.jira_create_remote_issue_link]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.MCP_DOCKER.tools.mcp-exec]
approval_mode = "approve"

[notice]
[notice.model_migrations]
'gpt-5.3-codex' = 'gpt-5.4'

[plugins]
[plugins.'github@openai-curated']
enabled = true

[plugins.'gmail@openai-curated']
enabled = true

[plugins.'google-calendar@openai-curated']
enabled = true

[plugins.'superpowers@openai-curated']
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."datadog@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[projects]
[projects."{{ .chezmoi.homeDir }}"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/.agents"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/.local/share/chezmoi"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/Projects"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/Projects/work"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/Projects/me/shall-we-eat"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/Projects/me/petrify"]
trust_level = "trusted"

[projects."{{ .chezmoi.homeDir }}/Projects/me/honey-bloom"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "context-used", "fast-mode"]
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
"gpt-6.1-sol" = 4

[apps.connector_76869538009648d5b282a4bb21c3d157.tools.github_merge_pull_request]
approval_mode = "approve"

[apps.connector_76869538009648d5b282a4bb21c3d157.tools.github_create_pull_request]
approval_mode = "approve"

[features]
goals = true

[hooks.state]

[mcp_servers.plaud]
command = "npx"
args = ["-y", "@plaud-ai/mcp@latest"]

[hooks.state."{{ .chezmoi.homeDir }}/.codex/hooks.json:permission_request:0:0"]
enabled = true

[mcp_servers.rea]
command = "npx"
args = [ "-y", "rea-agents@6.7.0", "mcp" ]
startup_timeout_sec = 30
tool_timeout_sec = 450
