# Mouse support
set -g mouse on

# 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# Escape key delay (vim/zsh responsiveness)
set -sg escape-time 0

# Focus events (vim autoread etc.)
set -g focus-events on

# History size
set -g history-limit 50000

# Window numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Auto-rename windows
set -g automatic-rename on
set -g renumber-windows on

# Change prefix key to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Window split keybindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation (Cmd+[ / Cmd+])
set -s user-keys[0] "\e[91;9u"
set -s user-keys[1] "\e[93;9u"
bind -n User0 select-pane -t :.-
bind -n User1 select-pane -t :.+

# Kill current session
bind X confirm-before -p "#[fg=#000000,bg=#f9e2af,bold]Kill session #S? (y/n)" kill-session

# Clear screen and scrollback
bind -n C-k send-keys C-l \; clear-history

# Pane border
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39

# Status bar
set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
